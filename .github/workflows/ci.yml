name: AidFast CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-check:
    name: Backend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend (TypeScript check)
        run: npm run build

      - name: Run backend tests
        run: npm test

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app-mode: [community, pharmacy]
    env:
      VITE_APP_MODE: ${{ matrix.app-mode }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check medicine catalog
        run: node scripts/checkM2Day4.cjs

      - name: Build frontend (Vite & TypeScript)
        run: npm run build

